name: kouyu
description: "Practise spoken Mandarin."
publish_to: "none"

# Android reads build-name as versionName and build-number as versionCode; iOS
# reads them as CFBundleShortVersionString and CFBundleVersion.
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    # Generated by tool/build_dictionary.dart from CC-CEDICT, and under its
    # licence (CC BY-SA 4.0) — see assets/dictionary/LICENCE.
    - assets/dictionary/

# Per-platform icons are generated from assets/icon/ by tool/generate_icons.sh,
# which also regenerates those source images. Run that script, not this config,
# after changing the icon.
flutter_launcher_icons:
  image_path: assets/icon/kouyu_icon.png
  android: true
  adaptive_icon_background: "#C8342A"
  adaptive_icon_foreground: assets/icon/kouyu_icon_foreground.png
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    background_color: "#C8342A"
    theme_color: "#C8342A"
