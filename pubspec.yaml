name: kouyu
description: "Practise spoken Mandarin."
publish_to: "none"

# Android reads build-name as versionName and build-number as versionCode; iOS
# reads them as CFBundleShortVersionString and CFBundleVersion.
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  llama_cpp_dart: ^0.9.0-dev.12
  path_provider: ^2.1.6
  crypto: ^3.0.7
  flutter_tts: ^4.2.5
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  shared_preferences_platform_interface: ^2.4.2
  archive: ^4.2.0

flutter:
  uses-material-design: true

  assets:
    # Generated by tool/build_dictionary.dart from CC-CEDICT, and under its
    # licence (CC BY-SA 4.0) — see assets/dictionary/LICENCE.
    #
    # Three listings, not one, because Flutter's asset directories are not
    # recursive. The same source data read three ways: pinyin to meaning,
    # English to Chinese words, and characters to the pinyin they are read
    # with.
    - assets/dictionary/
    - assets/dictionary/english/
    - assets/dictionary/characters/
    # Example sentences picked from Tatoeba by tool/build_examples.dart, under
    # its licence (CC BY 2.0 FR) — see assets/examples/LICENCE.
    - assets/examples/
    # Hand-written notes on near-synonyms, this project's own — see the
    # header of the file itself.
    - assets/notes/

# Per-platform icons are generated from assets/icon/ by tool/generate_icons.sh,
# which also regenerates those source images. Run that script, not this config,
# after changing the icon.
flutter_launcher_icons:
  image_path: assets/icon/kouyu_icon.png
  android: true
  adaptive_icon_background: "#C8342A"
  adaptive_icon_foreground: assets/icon/kouyu_icon_foreground.png
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    background_color: "#C8342A"
    theme_color: "#C8342A"
